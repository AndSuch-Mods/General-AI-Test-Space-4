name: Build Pages of Atlas v2

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Clone Pages of Atlas
        run: |
          git clone https://github.com/mattmcbeardface/pages-of-atlas.git pages-of-atlas
          cd pages-of-atlas
          git checkout d2955bda188bb6b6033d746e08a44f70a55479cd

      - name: Build mod and capture output
        shell: bash
        run: |
          cd pages-of-atlas
          chmod +x ./gradlew
          set +e
          ./gradlew clean build --stacktrace 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../build-status.txt
          exit 0

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: pages-of-atlas-build-log
          path: |
            build.log
            build-status.txt

      - name: Upload compiled JARs when present
        uses: actions/upload-artifact@v7
        with:
          name: pages-of-atlas-jars
          path: pages-of-atlas/build/libs/*.jar
          if-no-files-found: ignore
